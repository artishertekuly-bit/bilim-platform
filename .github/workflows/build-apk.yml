name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Capacitor 8 CLI: Node >= 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'  # Capacitor 7–8 Android: JDK 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Copy APK to root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./sana-bilim-platform.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sana-bilim-platform-apk
          path: ./sana-bilim-platform.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: Sana Bilim App v1.0.0 (Build ${{ github.run_number }})
          body: |
            ### Sana Bilim Android Қосымшасы (APK)
            - Жаңартылған мобильді UX/UI интерфейс
            - Артық блоктар мен түсіндірмелерден тазартылған дизайн
            - AI Тьютор, курстар, сабақтар және интерактивті тесттер
          files: ./sana-bilim-platform.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
